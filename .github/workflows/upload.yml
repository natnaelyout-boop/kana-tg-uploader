name: Telegram to GitHub Uploader

on:
  repository_dispatch:
    types: [upload_video]
  workflow_dispatch:

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install telethon requests

      - name: Run transfer script
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BIN_CHANNEL: ${{ secrets.BIN_CHANNEL }}
          GH_MEDIA_TOKEN: ${{ secrets.GH_MEDIA_TOKEN }}
          MESSAGE_ID: ${{ github.event.client_payload.message_id }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
        run: python transfer.py
